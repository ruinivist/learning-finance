<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Finance chart"><rect width="1000" height="560" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26364a"/></marker></defs><text x="55" y="49" font-size="27" fill="#26364a" font-weight="700" >From expected utility back to money</text><text x="55" y="81" font-size="17" fill="#62758c" font-weight="400" >Free bet: final wealth is 100 or 200, each with probability 50%.</text><rect x="55" y="109" width="885" height="69" rx="8" fill="#f8fafb" stroke="#dce3eb" stroke-width="1.3"/><text x="76" y="151" font-size="19" fill="#6853ac" font-weight="700" >1. Apply utility</text><text x="460" y="151" font-size="18" fill="#26364a" font-weight="400" >√100 = 10; √200 ≈ 14.142</text><rect x="55" y="194" width="885" height="69" rx="8" fill="#f8fafb" stroke="#dce3eb" stroke-width="1.3"/><text x="76" y="236" font-size="19" fill="#c95522" font-weight="700" >2. Average utility</text><text x="460" y="236" font-size="18" fill="#26364a" font-weight="400" >(10 + 14.142) / 2 ≈ 12.071</text><rect x="55" y="279" width="885" height="69" rx="8" fill="#f8fafb" stroke="#dce3eb" stroke-width="1.3"/><text x="76" y="321" font-size="19" fill="#008881" font-weight="700" >3. Invert utility</text><text x="460" y="321" font-size="18" fill="#26364a" font-weight="400" >u⁻¹(y) = y²; CE ≈ 145.71</text><line x1="136.58" y1="441" x2="843.42" y2="441" stroke="#91a0af" stroke-width="2"  /><line x1="178.16" y1="435" x2="178.16" y2="447" stroke="#91a0af" stroke-width="1.3"  /><text x="178.16" y="466" font-size="15" fill="#62758c" font-weight="400" text-anchor="middle">140</text><line x1="386.05" y1="435" x2="386.05" y2="447" stroke="#91a0af" stroke-width="1.3"  /><text x="386.05" y="466" font-size="15" fill="#62758c" font-weight="400" text-anchor="middle">145</text><line x1="593.95" y1="435" x2="593.95" y2="447" stroke="#91a0af" stroke-width="1.3"  /><text x="593.95" y="466" font-size="15" fill="#62758c" font-weight="400" text-anchor="middle">150</text><line x1="801.84" y1="435" x2="801.84" y2="447" stroke="#91a0af" stroke-width="1.3"  /><text x="801.84" y="466" font-size="15" fill="#62758c" font-weight="400" text-anchor="middle">155</text><circle cx="415.57" cy="441" r="7" fill="#008881"/><circle cx="593.95" cy="441" r="7" fill="#c95522"/><line x1="415.57" y1="376" x2="593.95" y2="376" stroke="#26364a" stroke-width="2"  marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="504.76" y="359" font-size="18" fill="#26364a" font-weight="600" text-anchor="middle">Risk premium = 4.29</text><line x1="415.57" y1="383" x2="415.57" y2="438" stroke="#008881" stroke-width="1.6"  /><line x1="593.95" y1="383" x2="593.95" y2="438" stroke="#c95522" stroke-width="1.6"  /><text x="400.57" y="504" font-size="17" fill="#008881" font-weight="600" text-anchor="end">CE = 145.71</text><text x="608.95" y="504" font-size="17" fill="#c95522" font-weight="600" >Mean = 150</text><text x="55" y="535" font-size="16" fill="#62758c" font-weight="400" >Guaranteed wealth 145.71 has the same utility as the free bet.</text></g></svg>